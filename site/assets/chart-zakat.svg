<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Annual zakat compared with the estimated cost of three global goals</title>
  <desc id="desc">Horizontal bar chart comparing an estimated 301 billion dollars given in zakat each year with about 114 billion dollars for universal safe water, 97 billion dollars for the education funding gap, and 27 billion dollars to end extreme hunger.</desc>
  <rect width="960" height="520" fill="#FBF7F1"/>
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#14294A">The money exists. The allocation is the question.</text>
  <text x="64" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5E6D80">Estimated annual zakat against the cost of three goals · US$ billions</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E6D80">
    <line x1="300" y1="130" x2="300" y2="390" stroke="#D9D0C4"/>
    <line x1="486" y1="130" x2="486" y2="390" stroke="#E6DED3"/>
    <line x1="672" y1="130" x2="672" y2="390" stroke="#E6DED3"/>
    <line x1="858" y1="130" x2="858" y2="390" stroke="#E6DED3"/>
    <text x="300" y="414" text-anchor="middle">0</text>
    <text x="486" y="414" text-anchor="middle">100</text>
    <text x="672" y="414" text-anchor="middle">200</text>
    <text x="858" y="414" text-anchor="middle">300</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="163" font-size="16.5" font-weight="bold" fill="#14294A">Annual zakat</text>
    <text x="64" y="184" font-size="13" fill="#5E6D80">estimated total</text>
    <rect x="300" y="144" width="560" height="34" rx="5" fill="#14294A"/>
    <text x="846" y="167" text-anchor="end" font-size="17" font-weight="bold" fill="#FFFFFF">$301B</text>

    <text x="64" y="235" font-size="16.5" font-weight="bold" fill="#14294A">Safe drinking water</text>
    <text x="64" y="256" font-size="13" fill="#5E6D80">universal access</text>
    <rect x="300" y="216" width="212" height="34" rx="5" fill="#1E4F8C"/>
    <text x="522" y="239" font-size="17" font-weight="bold" fill="#1E4F8C">$114B</text>

    <text x="64" y="307" font-size="16.5" font-weight="bold" fill="#14294A">Education gap</text>
    <text x="64" y="328" font-size="13" fill="#5E6D80">out-of-school children</text>
    <rect x="300" y="288" width="180" height="34" rx="5" fill="#A8152E"/>
    <text x="490" y="311" font-size="17" font-weight="bold" fill="#A8152E">$97B</text>

    <text x="64" y="379" font-size="16.5" font-weight="bold" fill="#14294A">Extreme hunger</text>
    <text x="64" y="400" font-size="13" fill="#5E6D80">cost to end</text>
    <rect x="300" y="360" width="50" height="34" rx="5" fill="#A8152E"/>
    <text x="360" y="383" font-size="17" font-weight="bold" fill="#A8152E">$27B</text>
  </g>

  <line x1="64" y1="450" x2="896" y2="450" stroke="#D9D0C4"/>
  <text x="64" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6D80">Sources: NZF Worldwide; Oxfam America; UNESCO; UN News. Illustrative comparison, rounded estimates.</text>
</svg>
