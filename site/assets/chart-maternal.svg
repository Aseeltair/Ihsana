<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Annual maternal and newborn deaths in selected OIC countries</title>
  <desc id="desc">Horizontal bar chart of annual maternal and newborn deaths: Nigeria about 234,000, Pakistan about 194,000, Niger about 37,600, Somalia about 30,000 and Chad about 29,000. Illustrative sample data.</desc>
  <rect width="960" height="520" fill="#FBF7F1"/>
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#14294A">Where the burden is concentrated</text>
  <text x="64" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5E6D80">Annual maternal and newborn deaths in selected countries · illustrative sample</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E6D80">
    <line x1="250" y1="126" x2="250" y2="380" stroke="#D9D0C4"/>
    <line x1="404" y1="126" x2="404" y2="380" stroke="#E6DED3"/>
    <line x1="558" y1="126" x2="558" y2="380" stroke="#E6DED3"/>
    <line x1="712" y1="126" x2="712" y2="380" stroke="#E6DED3"/>
    <line x1="866" y1="126" x2="866" y2="380" stroke="#E6DED3"/>
    <text x="250" y="404" text-anchor="middle">0</text>
    <text x="404" y="404" text-anchor="middle">50k</text>
    <text x="558" y="404" text-anchor="middle">100k</text>
    <text x="712" y="404" text-anchor="middle">150k</text>
    <text x="866" y="404" text-anchor="middle">200k+</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="158" font-size="17" font-weight="bold" fill="#14294A">Nigeria</text>
    <rect x="250" y="140" width="468" height="28" rx="4" fill="#A8152E"/>
    <text x="726" y="160" font-size="16" font-weight="bold" fill="#A8152E">234,000</text>

    <text x="64" y="206" font-size="17" font-weight="bold" fill="#14294A">Pakistan</text>
    <rect x="250" y="188" width="388" height="28" rx="4" fill="#A8152E" opacity=".9"/>
    <text x="646" y="208" font-size="16" font-weight="bold" fill="#A8152E">194,000</text>

    <text x="64" y="254" font-size="17" font-weight="bold" fill="#14294A">Niger</text>
    <rect x="250" y="236" width="75" height="28" rx="4" fill="#1E4F8C"/>
    <text x="333" y="256" font-size="16" font-weight="bold" fill="#1E4F8C">37,600</text>

    <text x="64" y="302" font-size="17" font-weight="bold" fill="#14294A">Somalia</text>
    <rect x="250" y="284" width="60" height="28" rx="4" fill="#1E4F8C" opacity=".88"/>
    <text x="318" y="304" font-size="16" font-weight="bold" fill="#1E4F8C">30,000</text>

    <text x="64" y="350" font-size="17" font-weight="bold" fill="#14294A">Chad</text>
    <rect x="250" y="332" width="58" height="28" rx="4" fill="#1E4F8C" opacity=".76"/>
    <text x="316" y="352" font-size="16" font-weight="bold" fill="#1E4F8C">29,000</text>
  </g>

  <line x1="64" y1="442" x2="896" y2="442" stroke="#D9D0C4"/>
  <text x="64" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6D80">Sample figures from the Ihsana country model preview. Country estimates are illustrative and rounded.</text>
</svg>
